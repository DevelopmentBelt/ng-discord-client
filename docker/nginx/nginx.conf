server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (M10)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Serve env.js so it can be overridden at container start (H9)
    location = /assets/env.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Angular SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — cache aggressively (Angular adds content-hash suffixes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not serve hidden files
    location ~ /\. {
        deny all;
    }
}
