<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # C2: directory listings disabled
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # C2: deny direct access to sensitive files and directories
    <FilesMatch "^(\.env.*|composer\.(json|lock|phar)|.*\.(sql|log|md|phar|sh))$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/(storage|src|migrations)/">
        Require all denied
    </DirectoryMatch>

    # Vendor dir should never be web-accessible
    <DirectoryMatch "/vendor/">
        Require all denied
    </DirectoryMatch>

    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
