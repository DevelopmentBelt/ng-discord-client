<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" (click)="close()" (keydown)="onKeydown($event)">
  <div
    class="bg-discord-lighter border border-discord-border rounded-lg shadow-xl w-full max-w-lg flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 border-b border-discord-border flex items-center justify-between">
      <div>
        <h3 class="text-lg font-semibold text-discord-text-lighter">My Profile</h3>
        <p class="text-sm text-discord-text-muted">Update your personal profile settings</p>
      </div>
      <button
        type="button"
        (click)="close()"
        class="p-2 text-discord-text-muted hover:text-discord-text-light hover:bg-discord-hover rounded transition-colors duration-150"
        title="Close"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>

    <form class="px-6 py-5 space-y-5" (ngSubmit)="save()">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 rounded-full overflow-hidden bg-discord-blue flex items-center justify-center text-white text-xl font-semibold flex-shrink-0">
          @if (userPic()) {
            <img [src]="userPic()" [alt]="username()" class="w-full h-full object-cover" />
          } @else {
            {{ avatarInitial() }}
          }
        </div>
        <div class="flex-1 min-w-0">
          <label class="block text-xs font-semibold text-discord-text-muted uppercase tracking-wider mb-1">Avatar URL</label>
          <input
            type="url"
            class="w-full px-3 py-2 rounded-md bg-discord-dark border border-discord-border text-discord-text-light placeholder-discord-text-muted focus:outline-none focus:border-discord-blue"
            placeholder="https://example.com/avatar.png"
            [ngModel]="userPic()"
            (ngModelChange)="userPic.set($event)"
            name="userPic"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-discord-text-muted uppercase tracking-wider mb-1">Username</label>
        <input
          type="text"
          required
          maxlength="32"
          class="w-full px-3 py-2 rounded-md bg-discord-dark border border-discord-border text-discord-text-light focus:outline-none focus:border-discord-blue"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-discord-text-muted uppercase tracking-wider mb-1">Email</label>
        <input
          type="email"
          disabled
          class="w-full px-3 py-2 rounded-md bg-discord-dark/60 border border-discord-border text-discord-text-muted cursor-not-allowed"
          [ngModel]="email()"
          name="email"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-discord-text-muted uppercase tracking-wider mb-1">Bio</label>
        <textarea
          rows="3"
          maxlength="255"
          class="w-full px-3 py-2 rounded-md bg-discord-dark border border-discord-border text-discord-text-light placeholder-discord-text-muted focus:outline-none focus:border-discord-blue resize-none"
          placeholder="Tell people a little about yourself"
          [ngModel]="userBio()"
          (ngModelChange)="userBio.set($event)"
          name="userBio"
        ></textarea>
      </div>

      @if (error()) {
        <p class="text-sm text-red-400">{{ error() }}</p>
      }
      @if (success()) {
        <p class="text-sm text-green-400">{{ success() }}</p>
      }

      <div class="flex justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="close()"
          class="px-4 py-2 rounded-md text-discord-text-muted hover:text-discord-text-light hover:bg-discord-hover transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="px-4 py-2 rounded-md bg-discord-blue hover:bg-discord-blue-dark text-white font-medium disabled:opacity-50 transition-colors"
        >
          {{ saving() ? 'Saving…' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
