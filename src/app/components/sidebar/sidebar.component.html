<div class="h-full flex flex-col items-center bg-discord-dark" id="angcord_servers">
  <div class="flex-1 min-h-0 w-full overflow-y-auto overflow-x-hidden py-4 space-y-2 flex flex-col items-center">
    <!-- Home Button -->
    <div
      class="w-12 h-12 rounded-xl cursor-pointer transition-all duration-200 hover:rounded-2xl hover:bg-discord-hover group relative flex-shrink-0"
      [ngClass]="(selectedServerId() == 'home') ? 'bg-discord-blue rounded-2xl' : 'bg-discord-medium'"
      (click)="selectHome()"
    >
      <div class="w-full h-full flex items-center justify-center">
        <svg class="w-6 h-6 text-discord-text-lighter" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
      </div>
      <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-1 h-0 bg-discord-text-lighter rounded-r-full transition-all duration-200 opacity-0 group-hover:h-8 group-hover:opacity-100"></div>
    </div>

    <!-- Inbox Button -->
    <div
      class="w-12 h-12 rounded-xl cursor-pointer transition-all duration-200 hover:rounded-2xl hover:bg-discord-hover group relative bg-discord-medium flex-shrink-0"
      (click)="openInbox()"
    >
      <div class="w-full h-full flex items-center justify-center relative">
        <svg class="w-6 h-6 text-discord-text-muted group-hover:text-discord-text-light transition-colors duration-200" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
        </svg>
        <app-notification-badge
          [count]="getUnreadCount()"
          [maxCount]="99"
          [size]="'sm'"
          [color]="'red'"
        ></app-notification-badge>
      </div>
      <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-1 h-0 bg-discord-text-lighter rounded-r-full transition-all duration-200 opacity-0 group-hover:h-8 group-hover:opacity-100"></div>
    </div>

    <!-- Separator -->
    <div class="w-8 h-px bg-discord-border rounded-full flex-shrink-0"></div>

    <!-- Server List -->
    @for (server of sidebarServers(); track server) {
      <div
        class="w-12 h-12 rounded-xl cursor-pointer transition-all duration-200 hover:rounded-2xl hover:bg-discord-hover group relative flex-shrink-0"
        [ngClass]="(selectedServerId() == server.serverId) ? 'bg-discord-blue rounded-2xl' : 'bg-discord-medium'"
        (click)="selectServer(server);"
      >
        <sidebar-server [server]="server">
        </sidebar-server>
        <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-1 h-0 bg-discord-text-lighter rounded-r-full transition-all duration-200 opacity-0 group-hover:h-8 group-hover:opacity-100"></div>
      </div>
    }

    <!-- Add Server Button -->
    <div
      class="w-12 h-12 rounded-xl cursor-pointer transition-all duration-200 hover:rounded-2xl hover:bg-discord-hover group relative bg-discord-medium flex-shrink-0"
      (click)="addServer();"
    >
      <div class="w-full h-full flex items-center justify-center">
        <svg class="w-6 h-6 text-discord-text-muted group-hover:text-discord-text-light transition-colors duration-200" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-1 h-0 bg-discord-text-lighter rounded-r-full transition-all duration-200 opacity-0 group-hover:h-8 group-hover:opacity-100"></div>
    </div>

    <!-- Explore Public Servers Button -->
    <div
      class="w-12 h-12 rounded-xl cursor-pointer transition-all duration-200 hover:rounded-2xl hover:bg-discord-hover group relative bg-discord-medium flex-shrink-0"
      (click)="exploreServers();"
    >
      <div class="w-full h-full flex items-center justify-center">
        <svg class="w-6 h-6 text-discord-text-muted group-hover:text-discord-text-light transition-colors duration-200" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-1 h-0 bg-discord-text-lighter rounded-r-full transition-all duration-200 opacity-0 group-hover:h-8 group-hover:opacity-100"></div>
    </div>
  </div>

  <!-- User / Logout — pinned to bottom -->
  <div class="w-full flex-shrink-0 flex flex-col items-center gap-2 py-3 border-t border-discord-border bg-discord-dark">
    <button
      type="button"
      class="avatar-effect avatar-effect--sidebar relative"
      [ngClass]="'avatar-effect--' + (currentUser()?.avatarEffect || 'none')"
      [title]="userSettingsTitle()"
      (click)="openUserSettings()"
    >
      <span class="avatar-effect__inner">
        @if (currentUser()?.userPic) {
          <img [src]="currentUser()?.userPic" [alt]="displayName()" />
        } @else {
          {{ avatarInitial() }}
        }
      </span>
      <span
        class="absolute -bottom-0.5 -right-0.5 z-10 w-3.5 h-3.5 rounded-full border-2 border-discord-darker pointer-events-none"
        [ngClass]="presenceDotClass()"
        aria-hidden="true"
      ></span>
    </button>
    <button
      type="button"
      class="w-10 h-8 mx-auto flex items-center justify-center rounded-lg text-[10px] uppercase tracking-wide bg-discord-medium text-discord-text-muted hover:bg-red-500 hover:text-white transition-colors"
      title="Log out"
      (click)="logout()"
    >
      Exit
    </button>
  </div>
</div>

<!-- Server Creation Modal -->
@if (showServerCreation()) {
  <app-server-creation-modal 
    (closeModal)="closeServerCreation()"
    (serverCreated)="onServerCreated($event)"
  ></app-server-creation-modal>
}

<!-- Server Browser Modal -->
@if (showServerBrowser()) {
  <app-server-browser
    (closeBrowser)="closeServerBrowser()"
    (serverJoined)="onServerJoined($event)"
  ></app-server-browser>
}

<!-- Inbox Modal -->
@if (showInboxModal()) {
  <app-inbox-modal
    (closeModal)="closeInboxModal()"
    (itemSelected)="onInboxItemSelected($event)"
  ></app-inbox-modal>
}

<!-- User Settings Modal -->
@if (showUserSettings()) {
  <app-user-settings-modal
    (closeModal)="closeUserSettings()"
  ></app-user-settings-modal>
}
